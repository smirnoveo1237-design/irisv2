name: Render keepalive

on:
  schedule:
    # Каждые 10 минут. Render засыпает после 15 минут без входящего трафика.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping Render health endpoint
        env:
          # Можно задать Repository variable RENDER_URL, иначе берётся имя из render.yaml.
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          set -euo pipefail
          base="${RENDER_URL:-https://irisv2.onrender.com}"
          url="${base%/}/health"
          echo "Pinging $url"
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 "$url"; then
              echo "Render is awake"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 20s"
            sleep 20
          done
          echo "Render did not answer" >&2
          exit 1
